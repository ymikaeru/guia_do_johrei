<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Alinhamento Bilíngue - Guia Johrei</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.3em;
            white-space: nowrap;
        }

        .header p {
            opacity: 0.85;
            font-size: 0.85em;
        }

        /* Auth banner */
        .auth-banner {
            background: #f1f3ff;
            border-bottom: 1px solid #d0d7ff;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9em;
        }

        .auth-banner .auth-label {
            color: #555;
            font-weight: 600;
        }

        .auth-banner input {
            padding: 6px 10px;
            border: 1px solid #c5c9f0;
            border-radius: 6px;
            font-size: 0.9em;
            width: 180px;
        }

        .auth-banner .btn-login {
            padding: 6px 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }

        .auth-banner .btn-login:hover {
            background: #5568d3;
        }

        .auth-banner .btn-logout {
            padding: 5px 12px;
            background: transparent;
            color: #667eea;
            border: 1px solid #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .auth-banner .user-email {
            color: #333;
            font-weight: 600;
        }

        .auth-banner .ai-status {
            margin-left: auto;
            font-size: 0.85em;
            color: #28a745;
            font-weight: 600;
        }

        .auth-banner .ai-status.offline {
            color: #999;
        }

        .controls {
            padding: 10px 24px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
        }

        .controls select,
        .controls button {
            padding: 7px 14px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls select {
            background: white;
            min-width: 220px;
        }

        .controls button {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .controls button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .controls button.danger {
            background: #dc3545;
            border-color: #dc3545;
        }

        .controls button.danger:hover {
            background: #c82333;
        }

        .controls button.success {
            background: #28a745;
            border-color: #28a745;
        }

        .controls button.success:hover {
            background: #218838;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-left: auto;
            font-size: 0.9em;
            color: #666;
        }

        .stats span {
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #dee2e6;
        }

        .editor-container {
            flex: 1;
            min-height: 0;
            padding: 12px 24px 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* flex children of editor-container */
        #editorContainer > .section-header,
        #editorContainer > .alignment-indicator,
        #editorContainer > .action-buttons,
        #editorContainer > .retrad-panel {
            flex-shrink: 0;
        }

        #editorContainer > .comparison-view {
            flex: 1;
            min-height: 0;
        }

        .section-header {
            background: #f8f9fa;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 {
            color: #667eea;
            font-size: 1.15em;
        }

        .section-nav {
            display: flex;
            gap: 10px;
        }

        .section-nav button {
            padding: 8px 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .section-nav button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .section-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .comparison-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 0;
        }

        .language-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 14px;
            border: 2px solid #e9ecef;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .language-panel h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .language-panel.japanese h3 {
            color: #dc3545;
        }

        .trim-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .trim-controls input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .trim-controls button {
            padding: 8px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .trim-controls button:hover {
            background: #c82333;
        }

        .content-editor {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.92em;
            line-height: 1.7;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            overflow-y: auto;
            flex: 1;
            min-height: 150px;
        }

        .content-editor:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .paragraph-count {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            display: inline-block;
        }

        .alignment-indicator {
            padding: 7px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 0.9em;
        }

        .alignment-indicator.aligned {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .alignment-indicator.misaligned {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            padding: 6px 0;
            flex-wrap: wrap;
        }

        .action-buttons button {
            padding: 9px 24px;
            font-size: 0.95em;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-reset {
            background: #6c757d;
            color: white;
        }

        .btn-reset:hover {
            background: #5a6268;
        }

        .btn-retrad {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
        }

        .btn-retrad:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .btn-retrad:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Retranslation review panel */
        .retrad-panel {
            margin-top: 30px;
            border: 2px solid #764ba2;
            border-radius: 15px;
            overflow: hidden;
            background: #fdf9ff;
        }

        .retrad-panel-header {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .retrad-panel-header h3 {
            font-size: 1.2em;
            margin: 0;
        }

        .retrad-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .retrad-status-ok {
            background: #d4edda;
            color: #155724;
        }

        .retrad-status-warn {
            background: #fff3cd;
            color: #856404;
        }

        .retrad-title-suggestion {
            font-size: 0.9em;
            opacity: 0.9;
            font-style: italic;
        }

        .retrad-content-area {
            padding: 20px 24px;
            max-height: 500px;
            overflow-y: auto;
        }

        .retrad-block {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: flex-start;
        }

        .retrad-marker {
            background: #764ba2;
            color: white;
            font-size: 0.75em;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            white-space: nowrap;
            margin-top: 3px;
            font-family: monospace;
            flex-shrink: 0;
        }

        .retrad-text {
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #222;
        }

        .retrad-panel-actions {
            padding: 16px 24px;
            background: #f4eeff;
            border-top: 1px solid #d9c9f0;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-approve {
            padding: 12px 30px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-approve:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-reject {
            padding: 12px 30px;
            background: white;
            color: #dc3545;
            border: 2px solid #dc3545;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reject:hover {
            background: #dc3545;
            color: white;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            border-left: 5px solid #28a745;
        }

        .notification.error {
            border-left: 5px solid #dc3545;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📚 Editor de Alinhamento Bilíngue</h1>
            <p>Alinhe perfeitamente o conteúdo português e japonês</p>
        </div>

        <div class="auth-banner" id="authBanner">
            <span class="auth-label">IA:</span>
            <span id="authStatus">Carregando...</span>
        </div>

        <div class="controls">
            <select id="volumeSelect">
                <option value="">Selecione um volume...</option>
            </select>
            <button onclick="loadVolume()">Carregar Volume</button>
            <button class="success" onclick="autoAlign()">🔄 Auto-Alinhar Parágrafos</button>
            <button class="danger" onclick="resetSection()">↺ Resetar Seção</button>
            <div class="stats">
                <span id="sectionCount">Seções: 0</span>
                <span id="currentSection">Atual: -</span>
            </div>
        </div>

        <div class="editor-container" id="editorContainer">
            <div class="loading">Selecione um volume para começar</div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // ── Config ────────────────────────────────────────────────────────────
        const SUPABASE_URL = 'https://succhmnbajvbpmoqrktq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1Y2NobW5iYWp2YnBtb3Fya3RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjY3MDgsImV4cCI6MjA5MjA0MjcwOH0.humCcLYpnnnapkLtLOeb9ZVo5EZWoWw6ItNo0WVY3DY';
        const EDGE_FN_URL = `${SUPABASE_URL}/functions/v1/gemini-retrad`;

        // ── State ─────────────────────────────────────────────────────────────
        let currentData = null;
        let currentSectionIndex = 0;
        let originalData = null;
        let supabaseClient = null;
        let currentSession = null;
        let pendingRetrad = null;

        // ── Volume list (only files that exist in data/BKP/) ──────────────────
        const volumes = [
            { file: 'BKP/johrei_vol01_bilingual.json', name: 'Johrei Vol. 01' },
            { file: 'BKP/johrei_vol02_bilingual.json', name: 'Johrei Vol. 02' },
            { file: 'BKP/johrei_vol03_bilingual.json', name: 'Johrei Vol. 03' },
            { file: 'BKP/johrei_vol04_bilingual.json', name: 'Johrei Vol. 04' },
            { file: 'BKP/johrei_vol05_bilingual.json', name: 'Johrei Vol. 05' },
            { file: 'BKP/johrei_vol06_bilingual.json', name: 'Johrei Vol. 06' },
            { file: 'BKP/johrei_vol07_bilingual.json', name: 'Johrei Vol. 07' },
            { file: 'BKP/johrei_vol08_bilingual.json', name: 'Johrei Vol. 08' },
            { file: 'BKP/johrei_vol09_bilingual.json', name: 'Johrei Vol. 09' },
            { file: 'BKP/johrei_vol10_bilingual.json', name: 'Johrei Vol. 10' },
            { file: 'BKP/estudo_aprofundado_bilingual.json', name: 'Estudo Aprofundado' },
        ];

        // ── Init ──────────────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', async () => {
            const select = document.getElementById('volumeSelect');
            volumes.forEach(vol => {
                const option = document.createElement('option');
                option.value = vol.file;
                option.textContent = vol.name;
                select.appendChild(option);
            });
            await initSupabase();
        });

        // ── Supabase auth ─────────────────────────────────────────────────────
        async function initSupabase() {
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data: { session } } = await supabaseClient.auth.getSession();
                currentSession = session;
                supabaseClient.auth.onAuthStateChange((_event, session) => {
                    currentSession = session;
                    renderAuthBanner();
                });
            } catch (e) {
                console.error('Supabase init error:', e);
            }
            renderAuthBanner();
        }

        function renderAuthBanner() {
            const banner = document.getElementById('authBanner');
            if (currentSession) {
                banner.innerHTML = `
                    <span class="auth-label">IA:</span>
                    <span class="user-email">${currentSession.user.email}</span>
                    <button class="btn-logout" onclick="signOut()">Sair</button>
                    <span class="ai-status">✓ Retradução com IA disponível</span>
                `;
            } else {
                banner.innerHTML = `
                    <span class="auth-label">Login para IA:</span>
                    <input type="email" id="loginEmail" placeholder="email" />
                    <input type="password" id="loginPass" placeholder="senha" onkeydown="if(event.key==='Enter') signIn()" />
                    <button class="btn-login" onclick="signIn()">Entrar</button>
                    <span class="ai-status offline">○ Retradução com IA requer login</span>
                `;
            }
        }

        async function signIn() {
            const email = document.getElementById('loginEmail')?.value;
            const pass = document.getElementById('loginPass')?.value;
            if (!email || !pass) return;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
            if (error) showNotification(`Login falhou: ${error.message}`, 'error');
        }

        async function signOut() {
            await supabaseClient.auth.signOut();
            showNotification('Sessão encerrada.', 'success');
        }

        // ── Volume loading ────────────────────────────────────────────────────
        async function loadVolume() {
            const select = document.getElementById('volumeSelect');
            const filename = select.value;

            if (!filename) {
                showNotification('Selecione um volume primeiro!', 'error');
                return;
            }

            try {
                const response = await fetch(`../data/${filename}`);
                if (!response.ok) throw new Error('Arquivo não encontrado');

                currentData = await response.json();
                originalData = JSON.parse(JSON.stringify(currentData));
                currentSectionIndex = 0;

                updateStats();
                renderEditor();
                showNotification('Volume carregado com sucesso!', 'success');
            } catch (error) {
                showNotification(`Erro ao carregar: ${error.message}`, 'error');
            }
        }

        function updateStats() {
            document.getElementById('sectionCount').textContent = `Seções: ${currentData.length}`;
            document.getElementById('currentSection').textContent = `Atual: ${currentSectionIndex + 1}/${currentData.length}`;
        }

        function renderEditor() {
            const container = document.getElementById('editorContainer');
            const section = currentData[currentSectionIndex];

            const ptContent = section.content_pt || '';
            const jpContent = section.content_jp || '';
            const ptParas = ptContent.split('\n\n').filter(p => p.trim()).length;
            const jpParas = jpContent.split('\n\n').filter(p => p.trim()).length;
            const isAligned = ptParas === jpParas;
            const aiBtn = currentSession
                ? `<button class="btn-retrad" id="btnRetrad" onclick="retranslateArticle()">🤖 Retraduzir com IA</button>`
                : `<button class="btn-retrad" disabled title="Faça login para usar IA">🤖 Retraduzir com IA</button>`;

            container.innerHTML = `
                <div class="section-header">
                    <h2>Seção ${currentSectionIndex + 1}: ${escapeHtml(section.title_pt || 'Sem título')}</h2>
                    <div class="section-nav">
                        <button onclick="previousSection()" ${currentSectionIndex === 0 ? 'disabled' : ''}>← Anterior</button>
                        <button onclick="nextSection()" ${currentSectionIndex === currentData.length - 1 ? 'disabled' : ''}>Próxima →</button>
                    </div>
                </div>

                <div class="alignment-indicator ${isAligned ? 'aligned' : 'misaligned'}">
                    ${isAligned ? '✓ Parágrafos alinhados!' : `⚠ Desalinhado: ${ptParas} PT vs ${jpParas} JP`}
                </div>

                <div class="comparison-view">
                    <div class="language-panel">
                        <h3>
                            🇧🇷 Português
                            <span class="paragraph-count">${ptParas} parágrafos</span>
                        </h3>
                        <div contenteditable="true" class="content-editor" id="ptEditor" oninput="updateParagraphCount('pt')">${escapeHtml(ptContent)}</div>
                    </div>

                    <div class="language-panel japanese">
                        <h3>
                            🇯🇵 Japonês
                            <span class="paragraph-count">${jpParas} parágrafos</span>
                        </h3>
                        <div class="trim-controls">
                            <input type="number" id="trimLines" placeholder="Linhas para remover do topo" min="1" max="50">
                            <button onclick="trimJapaneseTop()">✂️ Remover Topo</button>
                        </div>
                        <div contenteditable="true" class="content-editor" id="jpEditor" oninput="updateParagraphCount('jp')">${escapeHtml(jpContent)}</div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-save" onclick="saveChanges()">💾 Salvar Alterações</button>
                    ${aiBtn}
                    <button class="btn-reset" onclick="resetSection()">↺ Resetar Seção</button>
                </div>

                <div class="retrad-panel" id="retradPanel" style="display:none"></div>
            `;
        }

        // ── Paragraph utilities ───────────────────────────────────────────────
        function numberParagraphs(text) {
            const paras = (text || '').split(/\n\n+/).map(p => p.trim()).filter(Boolean);
            return {
                numbered: paras.map((p, i) => `¶${i + 1}\n${p}`).join('\n\n'),
                count: paras.length,
            };
        }

        function parseNumberedResponse(text) {
            const paras = [];
            const re = /¶\d+\s*\n([\s\S]*?)(?=\n*¶\d+\s*\n|$)/g;
            let m;
            while ((m = re.exec((text || '').trim())) !== null) {
                const content = m[1].trim();
                if (content) paras.push(content);
            }
            return paras;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // ── AI retranslation ──────────────────────────────────────────────────
        async function retranslateArticle() {
            if (!currentSession) {
                showNotification('Faça login para usar a IA', 'error');
                return;
            }

            const jpContent = document.getElementById('jpEditor').textContent;
            if (!jpContent.trim()) {
                showNotification('Conteúdo japonês está vazio', 'error');
                return;
            }

            const btn = document.getElementById('btnRetrad');
            btn.disabled = true;
            btn.textContent = '⏳ Traduzindo...';

            try {
                // Load system prompt from the same folder as this HTML
                const promptRes = await fetch('./PROMPT_RETRADUCAO_GUIA.md');
                if (!promptRes.ok) throw new Error('Não foi possível carregar PROMPT_RETRADUCAO_GUIA.md');
                const system_prompt = await promptRes.text();

                const section = currentData[currentSectionIndex];
                const res = await fetch(EDGE_FN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentSession.access_token}`,
                        'apikey': SUPABASE_ANON_KEY,
                    },
                    body: JSON.stringify({
                        content_jp: jpContent,
                        title_jp: section.title_jp || '',
                        title_pt_atual: section.title_pt || '',
                        system_prompt,
                    }),
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

                showRetradPanel(data.result);

            } catch (e) {
                showNotification(`Erro: ${e.message}`, 'error');
            } finally {
                const btn2 = document.getElementById('btnRetrad');
                if (btn2) {
                    btn2.disabled = false;
                    btn2.textContent = '🤖 Retraduzir com IA';
                }
            }
        }

        function showRetradPanel(result) {
            pendingRetrad = result;
            const panel = document.getElementById('retradPanel');
            if (!panel) return;

            const { content_ptbr_numbered, paragraph_count_jp, paragraph_count_pt, ok, title_ptbr } = result;
            const statusClass = ok ? 'retrad-status-ok' : 'retrad-status-warn';
            const statusText = ok
                ? `✓ Bijeção OK — ${paragraph_count_jp} parágrafos`
                : `⚠ Mismatch: ${paragraph_count_jp} JP ≠ ${paragraph_count_pt} PT`;

            const titleHtml = title_ptbr
                ? `<span class="retrad-title-suggestion">Título sugerido: ${escapeHtml(title_ptbr)}</span>`
                : '';

            const blocks = renderNumberedContent(content_ptbr_numbered);

            panel.innerHTML = `
                <div class="retrad-panel-header">
                    <h3>🤖 Proposta de Retradução</h3>
                    <span class="retrad-status ${statusClass}">${statusText}</span>
                    ${titleHtml}
                </div>
                <div class="retrad-content-area">${blocks}</div>
                <div class="retrad-panel-actions">
                    <button class="btn-reject" onclick="rejectRetranslation()">✗ Recusar</button>
                    <button class="btn-approve" onclick="approveRetranslation()">✓ Aprovar — substituir PT</button>
                </div>
            `;
            panel.style.display = 'block';
            panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderNumberedContent(numberedText) {
            const re = /¶(\d+)\s*\n([\s\S]*?)(?=\n*¶\d+\s*\n|$)/g;
            const blocks = [];
            let m;
            while ((m = re.exec((numberedText || '').trim())) !== null) {
                const content = m[2].trim();
                if (content) blocks.push({ n: m[1], text: content });
            }
            if (!blocks.length) {
                return `<pre style="white-space:pre-wrap;font-family:monospace">${escapeHtml(numberedText)}</pre>`;
            }
            return blocks.map(b => `
                <div class="retrad-block">
                    <span class="retrad-marker">¶${b.n}</span>
                    <span class="retrad-text">${escapeHtml(b.text)}</span>
                </div>
            `).join('');
        }

        function approveRetranslation() {
            if (!pendingRetrad) return;
            const clean = pendingRetrad.content_ptbr_numbered
                .replace(/¶\d+\s*\n/g, '')
                .trim();
            const ptEditor = document.getElementById('ptEditor');
            if (ptEditor) {
                ptEditor.textContent = clean;
                updateParagraphCount('pt');
            }
            rejectRetranslation();
            showNotification('Retradução aprovada! Clique em "Salvar Alterações" para confirmar.', 'success');
        }

        function rejectRetranslation() {
            pendingRetrad = null;
            const panel = document.getElementById('retradPanel');
            if (panel) {
                panel.style.display = 'none';
                panel.innerHTML = '';
            }
        }

        // ── Editor helpers ────────────────────────────────────────────────────
        function updateParagraphCount(lang) {
            const editor = document.getElementById(`${lang}Editor`);
            const count = editor.textContent.split('\n\n').filter(p => p.trim()).length;
            editor.parentElement.querySelector('.paragraph-count').textContent = `${count} parágrafos`;

            const ptCount = document.getElementById('ptEditor').textContent.split('\n\n').filter(p => p.trim()).length;
            const jpCount = document.getElementById('jpEditor').textContent.split('\n\n').filter(p => p.trim()).length;
            const indicator = document.querySelector('.alignment-indicator');

            if (ptCount === jpCount) {
                indicator.className = 'alignment-indicator aligned';
                indicator.innerHTML = '✓ Parágrafos alinhados!';
            } else {
                indicator.className = 'alignment-indicator misaligned';
                indicator.innerHTML = `⚠ Desalinhado: ${ptCount} PT vs ${jpCount} JP`;
            }
        }

        function trimJapaneseTop() {
            const lines = parseInt(document.getElementById('trimLines').value);
            if (!lines || lines < 1) {
                showNotification('Digite um número válido de linhas!', 'error');
                return;
            }

            const editor = document.getElementById('jpEditor');
            const content = editor.textContent;
            const allLines = content.split('\n');

            if (lines >= allLines.length) {
                showNotification('Número de linhas maior que o conteúdo!', 'error');
                return;
            }

            editor.textContent = allLines.slice(lines).join('\n');
            updateParagraphCount('jp');
            showNotification(`${lines} linhas removidas do topo!`, 'success');
        }

        function autoAlign() {
            const ptEditor = document.getElementById('ptEditor');
            const jpEditor = document.getElementById('jpEditor');

            const ptParas = ptEditor.textContent.split('\n\n').filter(p => p.trim());
            const jpParas = jpEditor.textContent.split('\n\n').filter(p => p.trim());

            if (ptParas.length === jpParas.length) {
                showNotification('Já está alinhado!', 'success');
                return;
            }

            if (jpParas.length > ptParas.length) {
                const diff = jpParas.length - ptParas.length;
                showNotification(`JP tem ${diff} parágrafos a mais. Ajuste manualmente ou use "Retraduzir com IA".`, 'error');
            } else {
                const diff = ptParas.length - jpParas.length;
                showNotification(`PT tem ${diff} parágrafos a mais. Ajuste manualmente ou use "Retraduzir com IA".`, 'error');
            }
        }

        function saveChanges() {
            const section = currentData[currentSectionIndex];
            section.content_pt = document.getElementById('ptEditor').textContent;
            section.content_jp = document.getElementById('jpEditor').textContent;
            showNotification('Alterações salvas na memória! Use "Exportar JSON" para salvar permanentemente.', 'success');
        }

        function resetSection() {
            currentData[currentSectionIndex] = JSON.parse(JSON.stringify(originalData[currentSectionIndex]));
            renderEditor();
            showNotification('Seção resetada!', 'success');
        }

        function previousSection() {
            if (currentSectionIndex > 0) {
                currentSectionIndex--;
                updateStats();
                renderEditor();
            }
        }

        function nextSection() {
            if (currentSectionIndex < currentData.length - 1) {
                currentSectionIndex++;
                updateStats();
                renderEditor();
            }
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            setTimeout(() => { notification.style.display = 'none'; }, 4000);
        }

        // ── Keyboard shortcuts ────────────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 's') {
                    e.preventDefault();
                    saveChanges();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    previousSection();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextSection();
                }
            }
        });
    </script>
</body>

</html>
